name: Run Nifty 100 Screener

on:
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas pyyaml requests openpyxl

      - name: Run screener
        run: |
          python screener.py

      - name: Upload Excel result
        uses: actions/upload-artifact@v4
        with:
          name: nifty100-screener-result
          path: "*.xlsx"
